<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOODBAR</title>

    <link rel="stylesheet" href="signup-style.css">
    <link rel="stylesheet" href="home-style.css">
</head>

<body>

<header>
    <nav>

        <!-- Logo -->
        <div>
            <a href="/">
                <img
                    style="width:7vh;height:7vh;border-radius:100%;margin-right:5px;"
                    src="res/logo-original.jpeg"
                    alt="logo">
            </a>
        </div>

        <!-- Search -->
        <div style="display:flex;">
            <div style="margin-top:17px;">
                <img
                    style="width:25px;"
                    src="res/search-icon.png"
                    alt="search-icon">
            </div>

            <input
                name="search"
                type="search"
                placeholder="Search Food..."
                style="width:20vw;">
        </div>

        <!-- Website Name -->
        <div class="centerName">
            F O O D B A R
        </div>

        <!-- Navigation -->
        <div class="navul">

            <ul style="list-style:none;display:flex;gap:clamp(10px,4vw,60px);align-items:center;">

                <li>
                    <a href="/location">
                        <img style="width:40px;" src="res/location-icon.png">
                    </a>
                </li>

                <li>
                    <a href="/cart">
                        <img style="width:40px;" src="res/cart-icon.png">
                    </a>
                </li>

                <li>
                    <a href="/about">
                        <img style="width:40px;height:40px;" src="res/about_us_icon.png">
                    </a>
                </li>

                <li>
                    <a href="/profile">
                        <img style="width:40px;" src="res/profile-icon.png">
                    </a>
                </li>

                <li>
                    <a href="/login" style="text-decoration:none;color:black;font-weight:bold;">
                        Login
                    </a>
                </li>

                <li>
                    <a href="/signup" style="text-decoration:none;color:black;font-weight:bold;">
                        Signup
                    </a>
                </li>

            </ul>

        </div>

        <!-- Hamburger -->
        <div>
            <button
                class="ham"
                style="background:transparent;border:none;margin-right:10px;">

                <img
                    style="width:7vh;cursor:pointer;"
                    src="res/ham-menu.png"
                    alt="ham-menu">

            </button>
        </div>

    </nav>
</header>

<!-- Hamburger Menu -->

<section style="position:relative;">

<div class="ham-menu"
style="
z-index:1;
background-color:aliceblue;
min-height:100px;
min-width:50vw;
top:100px;
right:50px;
position:absolute;
visibility:hidden;
border-radius:20px;">

<ul style="
list-style:none;
display:flex;
flex-direction:column;
gap:25px;
font-family:Poppins,sans-serif;
color:#2F3542;
letter-spacing:5px;
font-size:25px;
font-weight:bold;">

<li>
<a style="text-decoration:none;color:#2F3542;" href="/location">
<img style="width:40px;" src="res/location-icon.png">
Location
</a>
</li>

<li>
<a style="text-decoration:none;color:#2F3542;" href="/cart">
<img style="width:40px;" src="res/cart-icon.png">
Cart
</a>
</li>

<li>
<a style="text-decoration:none;color:#2F3542;" href="/about">
<img style="width:40px;" src="res/about_us_icon.png">
About Us
</a>
</li>

<li>
<a style="text-decoration:none;color:#2F3542;" href="/profile">
<img style="width:40px;" src="res/profile-icon.png">
Profile
</a>
</li>

<li>
<a style="text-decoration:none;color:#2F3542;" href="/login">
Login
</a>
</li>

<li>
<a style="text-decoration:none;color:#2F3542;" href="/signup">
Signup
</a>
</li>

</ul>

</div>

</section>

<!-- Main Section -->

<section class="hero">

<section class="card1">

<section class="card2">

<img
style="width:250px;border-radius:20px;"
src="res/aquatic-img.webp">

<button
onclick="location.href='/restaurants'"
style="
margin:20px;
font-size:20px;
border-radius:10px;
color:white;
background:#FF5200;
font-family:'Poppins',sans-serif;
font-weight:bold;
cursor:pointer;">

Order by Restaurants

</button>

</section>

<section class="card2">

<img
style="width:250px;border-radius:20px;"
src="res/food.jpeg">

<button
onclick="location.href='/food'"
style="
margin:20px;
font-size:20px;
border-radius:10px;
color:white;
background:#FF5200;
font-family:'Poppins',sans-serif;
font-weight:bold;
cursor:pointer;">

Order by Food

</button>

</section>

</section>

</section>

<script src="home-script.js"></script>

</body>
</html>
