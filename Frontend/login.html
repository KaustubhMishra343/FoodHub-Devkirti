<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD BAR - Login</title>
    <link rel="stylesheet" href="login-style.css">
</head>

<body>

    <nav>

        <div>
            <a href="/">
                <img
                    style="width:70px;height:70px;border-radius:100%;"
                    src="res/logo-original.jpeg"
                    alt="logo">
            </a>
        </div>

        <div class="centerName">
            F O O D B A R
        </div>

        <div>
            <a href="/about">
                <img
                    style="width:70px;height:70px;"
                    src="res/about_us_icon.png"
                    alt="about us">
            </a>
        </div>

    </nav>

    <section class="hero">

        <section class="card1">

            <h1>LOGIN</h1>

            <form action="/login" method="POST" class="entry">

                <input
                    id="login"
                    type="email"
                    name="email"
                    placeholder="Email"
                    required>

                <br>

                <input
                    id="login"
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

                <br>

                <input
                    class="login-button"
                    type="submit"
                    value="Login">

            </form>

            <p style="font-size:16px;color:#F4C095;">

                or login using

            </p>

            <a href="#">
                <img
                    style="width:30px;"
                    src="res/googleicon.png"
                    alt="google">
            </a>

            <br>

            <p style="font-size:18px;color:#F4C095;">

                New User?

                <a href="/signup"
                   style="color:white;font-weight:bold;">

                    Sign-Up

                </a>

            </p>

        </section>

    </section>

</body>
</html>
