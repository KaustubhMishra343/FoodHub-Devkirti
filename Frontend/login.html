<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD BAR - Login</title>

    <link rel="stylesheet" href="login-style.css">
</head>

<body>

<nav>

    <div class="logo">
        <a href="/">
            <img class="logoimg"
            src="res/logo-original.jpeg"
            alt="">
        </a>
    </div>

    <div class="centerName">
        F O O D B A R
    </div>

    <a href="/about">
        <img class="about"
        src="res/about_us_icon.png"
        alt="about us">
    </a>

</nav>

<section class="hero">

<section class="card1">

<h1>Login</h1>

<section class="entry">

<form action="/login" method="POST">

<br>

<input
type="email"
name="email"
placeholder="Email"
required>

<br>

<input
type="password"
name="password"
placeholder="Password"
required>

<br>

<button
type="submit"
class="login-button">

Login

</button>

</form>

</section>

</section>

<h2>or login using</h2>

<a href="#">
<img
style="height:30px;"
src="res/googleicon.png"
alt="">
</a>

<div style="display:flex;gap:10px;">

<pre style="font-size:20px">
new user →
</pre>

<a
href="/signup"
style="
color:#F4C095;
font-family:cursive;
font-weight:bold;
font-size:20px;
text-decoration:underline;
padding-top:17px;">

Sign-up

</a>

</div>

</section>

</body>
</html>
